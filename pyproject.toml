[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cayde420"
version = "0.4.0"
description = "Cayde 420 — local-only AI desktop assistant (Ollama + LiteLLM)"
requires-python = ">=3.11"
dependencies = [
    "litellm==1.102.1",
    "PySide6==6.11.1",
    "requests==2.34.2",
    "psutil==7.2.2",
    "pynvml==13.0.1",
    "ollama==0.6.2",
    "mcp==1.29.0",
]

[project.scripts]
cayde420 = "main:main"
cayde420-setup = "setup:main"
cayde420-config = "config:main"

[tool.setuptools]
py-modules = ["main", "backend", "configs", "settings", "hardware", "config", "history", "memory_vault", "mcp_grants", "mcp_server", "model_registry", "opencode_bridge", "netutil", "styles", "widgets"]